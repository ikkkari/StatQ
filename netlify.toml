[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy API calls directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://statq.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy WebSocket connections directly to Render backend
[[redirects]]
  from = "/ws"
  to = "wss://statq.onrender.com/ws"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
